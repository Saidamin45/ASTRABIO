<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASTRABIO</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#0B1426;--card:#15233F;--cy:#22D3EE;--or:#FF7A3D;--rd:#EF4444;--gr:#34D399;--yl:#FACC15;--tx:#fff;--mut:#8DA2C4}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 'Space Grotesk',system-ui,sans-serif;overflow:hidden}
#app{display:grid;height:100vh;grid-template:"top top" 56px "rail main" 1fr "vb vb" 88px/92px 1fr}
#top{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid #1d3157}
#top .sp{flex:1}.badge{padding:4px 12px;border-radius:99px;font-size:13px;border:1px solid var(--cy);color:var(--cy)}
.badge.d{border-color:var(--yl);color:var(--yl)}
#rail{grid-area:rail;display:flex;flex-direction:column;gap:6px;padding:10px 8px;border-right:1px solid #1d3157;overflow:auto}
#rail button{background:none;border:0;color:var(--mut);padding:8px 2px;border-radius:14px;font:inherit;font-size:11px;cursor:pointer;min-height:56px}
#rail button i{display:block;font-style:normal;font-size:22px}
#rail button.on{background:var(--card);color:var(--cy);box-shadow:0 0 14px #22D3EE55}
#main{grid-area:main;overflow:auto;padding:18px 24px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 0 24px #22D3EE14}
h1{font-size:30px;font-weight:500;margin:0 0 8px}h2{margin:0;font-size:24px}h3{margin:0 0 6px;font-size:16px;color:var(--mut);font-weight:500}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.chip,.cmd,.btn,.f{border:1px solid #2b4274;background:var(--card);color:var(--tx);border-radius:99px;padding:10px 18px;font:inherit;cursor:pointer;min-height:44px}
.cmd{color:var(--cy)}.f.on{background:var(--cy);color:var(--bg);border-color:var(--cy)}
.btn{background:var(--cy);color:var(--bg);border:0;font-weight:700}.btn.o{background:none;color:var(--or);border:1px solid var(--or)}
.st{display:inline-flex;gap:6px;align-items:center;padding:6px 14px;border-radius:99px;font-size:14px;border:1px solid currentColor}
.mod{display:flex;gap:8px;align-items:center;cursor:pointer}
canvas.b{width:100%;height:100%;display:block;touch-action:none}
.orbw{display:grid;place-items:center;padding:20px}
.orb{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a5f3fc,var(--cy) 40%,#0e5a73 80%);box-shadow:0 0 60px #22D3EE88;animation:br 4s ease-in-out infinite;flex:none}
.orb.sp{animation:sp .7s ease-in-out infinite}.orb.sm{width:96px;height:96px}
@keyframes br{50%{transform:scale(1.04);box-shadow:0 0 80px #22D3EEaa}}@keyframes sp{50%{transform:scale(1.14);box-shadow:0 0 110px #22D3EE}}
.mgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:14px}.col{display:flex;flex-direction:column;gap:14px}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.val{font-size:30px;font-weight:700}.val small{font-size:14px;color:var(--mut);font-weight:400}
.ins{border-left:4px solid var(--cy)}.warn{background:#3a1f1b;border:1px solid var(--or);color:#ffd2bd}
.banner{position:fixed;top:64px;left:50%;transform:translate(-50%,-140%);transition:.5s;background:#3a1f1b;border:1px solid var(--or);padding:12px 22px;border-radius:16px;z-index:9;box-shadow:0 0 30px #FF7A3D66}
.banner.show{transform:translate(-50%,0)}
.tr{height:360px;position:relative}.side{position:absolute;right:12px;top:12px;width:300px;z-index:2}
input[type=range]{width:100%;accent-color:var(--cy);height:36px}
#vb{grid-area:vb;display:flex;align-items:center;gap:16px;padding:0 22px;border-top:1px solid #1d3157;background:#0e1a33}
#mic{width:64px;height:64px;border-radius:50%;border:0;background:var(--cy);color:var(--bg);font-size:26px;cursor:pointer;box-shadow:0 0 28px #22D3EE99;flex:none}
#mic.on{background:var(--or);box-shadow:0 0 36px #FF7A3Daa}
#wave{display:flex;gap:3px;align-items:center;height:40px}#wave i{width:4px;height:6px;background:var(--cy);border-radius:3px}
#wave.on i{animation:w .6s ease-in-out infinite alternate}@keyframes w{to{height:36px}}
#tl{flex:1;min-width:0}#tl input{width:100%;background:var(--card);border:1px solid #2b4274;border-radius:99px;color:var(--tx);padding:8px 16px;font:inherit}
#tt{font-size:14px;color:var(--cy);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hint{color:var(--mut);font-size:12px;margin-top:3px}
.chat{height:300px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.bub{max-width:72%;padding:10px 16px;border-radius:18px;background:var(--card)}.bub.u{align-self:flex-end;background:#0e5a73}
.dots{display:flex;gap:8px}.dots i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-style:normal}
.bar{height:14px;border-radius:9px;background:#0B1426;overflow:hidden}.bar b{display:block;height:100%}
.ev{padding:3px 10px;border-radius:99px;font-size:12px;border:1px solid var(--cy);color:var(--cy)}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--cy);color:var(--bg);padding:10px 20px;border-radius:99px;opacity:0;transition:.3s;z-index:9}
@media(max-width:900px){.grid2,.mgrid{grid-template-columns:1fr}.side{position:static;width:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
button:focus-visible,input:focus-visible{outline:2px solid var(--yl);outline-offset:2px}
.ti{display:block;width:100%;margin-top:4px;background:#0B1426;border:1px solid #2b4274;border-radius:12px;color:#fff;padding:8px 12px;font:inherit}label{color:var(--mut);font-size:14px}
</style></head><body>
<div id="app">
<header id="top"><b style="color:var(--cy);letter-spacing:2px">ASTRABIO</b><b>Cdr. Amara Okafor</b><span id="dn"></span><span class="sp"></span><span class="badge">● Local demo mode</span><span class="badge d">Demo data</span></header>
<nav id="rail"></nav><main id="main"></main>
<footer id="vb"><button id="mic" title="Talk to Nova" aria-label="Talk to Nova">🎙</button><div id="wave"></div>
<div id="tl"><div id="tt">Nova is ready</div><input id="ti" placeholder="Type to Nova, or press Enter…"><div class="hint">Say "Hey Nova" or tap the mic</div></div>
<button class="f" id="mute">🔊 Voice on</button></footer></div>
<div class="banner" id="bn"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),COL={normal:'#34D399',watch:'#FACC15',warning:'#FF7A3D',critical:'#EF4444'},
IC={normal:'✓',watch:'◆',warning:'▲',critical:'⚠'},LB={normal:'Normal',watch:'Watch',warning:'Warning',critical:'Critical'},
CH={stable:['Stable','✓','#34D399'],watch:['Watch','◆','#FACC15'],alert:['Alert','▲','#FF7A3D']},
NAV=[['home','⌂','Home'],['checkin','✎','Check-in'],['body','☍','Body Map'],['radiation','☢','Radiation'],['gravity','⇩','Gravity'],['immune','✚','Immune'],['mind','☾','MindSpace'],['habitat','▣','Habitat'],['companion','◉','Companion'],['research','⚗','Research']],
HZ=['all','radiation','gravity','immune','mind','habitat'],LAY=['skin','muscle','skeleton','organs','brain'],
CMDS=['How am I doing today?','Explain my radiation level','Show my body map','I feel lonely','Open my daily check-in'];
let S,day=142,screen='home',sel=null,flt='all',layer='skin',body=null,pulse=null,LOG=[],muted=false,rsel='legs',speaking=false;
const stChip=(l)=>`<span class="st" style="color:${COL[l]}">${IC[l]} ${LB[l]}</span>`,
modChip=(c)=>{const[a,b,k]=CH[c];return `<span class="st" style="color:${k}">${b} ${a}</span>`};
function chart(v,col,h=90){const mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1,p=v.map((y,i)=>`${i*(300/(v.length-1))},${h-8-(y-mn)/r*(h-24)}`).join(' ');
return `<svg viewBox="0 0 300 ${h}" width="100%"><polyline points="${p}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round"/><text x="0" y="12" fill="#8DA2C4" font-size="11">${mx}</text><text x="0" y="${h-1}" fill="#8DA2C4" font-size="11">${mn}</text></svg>`}
const met=m=>`<div class="card"><h3>${m.label}</h3><div class="val">${m.value} <small>${m.unit}</small></div>${stChip(m.level)}${chart(m.series,COL[m.level])}<small style="color:var(--mut)">last 14 days</small></div>`;
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2400)}

/* ---------- 3D body ---------- */
function mkBody(cv,o){
const W=cv.clientWidth||400,H=cv.clientHeight||400,r=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});r.setPixelRatio(devicePixelRatio);r.setSize(W,H,false);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(35,W/H,.1,50);cam.position.set(0,1.0,o.cz||5);cam.lookAt(0,.98,0);
sc.add(new THREE.AmbientLight(0x88aacc,.9));const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(2,3,4);sc.add(dl);
const root=new THREE.Group();sc.add(root);const L={};LAY.forEach(k=>{L[k]=new THREE.Group();root.add(L[k])});
const SG=new THREE.SphereGeometry(1,24,16),CG=new THREE.CylinderGeometry(1,1,1,20),mt=(c,op)=>new THREE.MeshStandardMaterial({color:c,transparent:true,opacity:op,roughness:.5});
const add=(g,geo,m,x,y,z,sx,sy,sz)=>{const e=new THREE.Mesh(geo,m);e.position.set(x,y,z);e.scale.set(sx,sy,sz);g.add(e);return e};
const parts=(g,m,k)=>{add(g,SG,m,0,1.73,0,.12*k,.14*k,.13*k);add(g,CG,m,0,1.25,0,.21*k,.6,.13*k);add(g,SG,m,0,.93,0,.2*k,.12,.13*k);
[-1,1].forEach(s=>{add(g,CG,m,s*.11,.65,0,.085*k,.5,.085*k);add(g,CG,m,s*.11,.2,0,.065*k,.45,.065*k);add(g,CG,m,s*.3,1.28,0,.05*k,.55,.05*k)})};
const skinM=mt(0x22D3EE,.28);parts(L.skin,skinM,1);parts(L.muscle,mt(0xC0392B,.55),.8);
const bm=mt(0xE5E7EB,.9);add(L.skeleton,SG,bm,0,1.73,0,.095,.11,.1);add(L.skeleton,CG,bm,0,1.22,-.05,.02,.62,.02);
for(let i=0;i<4;i++)add(L.skeleton,SG,bm,0,1.5-i*.1,0,.17,.012,.1);add(L.skeleton,SG,bm,0,.93,0,.17,.07,.09);
[-1,1].forEach(s=>{add(L.skeleton,CG,bm,s*.11,.65,0,.03,.5,.03);add(L.skeleton,CG,bm,s*.11,.2,0,.025,.45,.025);add(L.skeleton,CG,bm,s*.3,1.28,0,.02,.55,.02);add(L.organs,SG,mt(0xF9A8D4,.8),s*.1,1.42,0,.07,.12,.06)});
add(L.organs,SG,mt(0xEF4444,.9),.07,1.4,.04,.05,.05,.05);add(L.organs,SG,mt(0xE9967A,.9),0,1.06,.03,.12,.09,.07);add(L.brain,SG,mt(0xF9A8D4,.95),0,1.74,0,.085,.085,.085);add(L.brain,SG,mt(0xE5E7EB,.2),0,1.73,0,.12,.14,.13);
function setLayer(k){layer=k;LAY.forEach(x=>L[x].visible=x==k||(x=='skin'&&k=='skin')||(k=='organs'&&x=='skeleton'));skinM.opacity=k=='skin'?.3:.07}
const mk=[];S.markers.forEach(m=>{const g=new THREE.Group();g.position.set(...m.pos);const c=new THREE.MeshBasicMaterial({color:0x34D399}),h=new THREE.MeshBasicMaterial({color:0x34D399,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false});
const a=new THREE.Mesh(new THREE.SphereGeometry(.04,16,12),c),b=new THREE.Mesh(new THREE.SphereGeometry(.12,16,12),h);b.userData.id=m.id;g.add(a,b);root.add(g);mk.push({m,g,c,h,a,b})});
function update(){mk.forEach(k=>{const m=S.markers.find(x=>x.id==k.m.id),col=new THREE.Color(COL[m.level]);k.m=m;k.c.color=col;k.h.color=col;k.g.visible=(!o.filter||o.filter=='all'||m.hazards.includes(o.filter))&&(o.filter!=null||true)})}
update();setLayer(o.layer||'skin');
let drag=0,mv=0,lx=0;cv.onpointerdown=e=>{drag=1;mv=0;lx=e.clientX;cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(drag){root.rotation.y+=(e.clientX-lx)*.01;mv+=Math.abs(e.clientX-lx);lx=e.clientX}};
cv.onpointerup=e=>{drag=0;if(mv<5&&o.onPick){const rc=cv.getBoundingClientRect(),v=new THREE.Vector2((e.clientX-rc.left)/rc.width*2-1,-(e.clientY-rc.top)/rc.height*2+1),ra=new THREE.Raycaster();ra.setFromCamera(v,cam);
const hit=ra.intersectObjects(mk.filter(k=>k.g.visible).map(k=>k.b))[0];if(hit)o.onPick(hit.object.userData.id)}};
let t=0,raf;(function loop(){raf=requestAnimationFrame(loop);t+=.016;if(o.auto&&!drag)root.rotation.y=Math.sin(t*.5)*.6;
mk.forEach((k,i)=>{const bad=k.m.level=='warning'||k.m.level=='critical',pu=pulse==k.m.id,s=pu?1.5+.5*Math.sin(t*9):bad?1.15+.2*Math.sin(t*4+i):1+.05*Math.sin(t*2+i);k.a.scale.setScalar(s);k.b.scale.setScalar(s*(k.m.id==sel?1.4:1))});r.render(sc,cam)})();
return{update,setLayer,filter:f=>{o.filter=f;update()},destroy(){cancelAnimationFrame(raf);r.dispose()}}}

/* ---------- screens ---------- */
const SC={};
const sideHTML=m=>`<div class="card side" style="background:#0e1a33"><div class="row" style="justify-content:space-between"><b style="font-size:20px">${m.name}</b>${stChip(m.level)}</div><p style="margin:6px 0;color:var(--mut)">Affected by: ${m.hazards.join(', ')}</p><h3>${m.label}</h3><div class="val">${m.value} <small>${m.unit}</small></div>${chart(m.series,COL[m.level],60)}<p>${m.text}</p><div class="row"><button class="btn" onclick="ask('Tell me about my ${m.name}')">Ask Nova</button><button class="btn o" onclick="toast('Medical review requested (demo)')">Escalate to medical review</button></div></div>`;
SC.home=()=>{const n=S.attention,al=Object.entries(S.modules).filter(([k,m])=>m.chip=='alert').map(([k])=>k);
return `<div class="grid2"><div class="card row" style="min-height:300px"><div class="orbw"><div class="orb ${speaking?'sp':''}" id="orb"></div></div><div style="flex:1;min-width:220px"><h1>Good morning. Your overall status is stable. ${n?`${n} thing${n>1?'s':''} need${n>1?'':'s'} attention.`:'Nothing needs attention.'}</h1><p style="color:var(--mut)">${al.length?'Needs attention: '+al.join(', ')+'.':''} Ask me anything.</p></div></div>
<div class="card" style="min-height:300px;padding:6px"><canvas class="b" id="cv"></canvas></div></div>
${remCard()}<div class="chips">${Object.entries(S.modules).map(([k,m])=>`<div class="card mod" onclick="go('${k}')"><b>${k[0].toUpperCase()+k.slice(1)}</b>${modChip(m.chip)}</div>`).join('')}</div>
<div class="chips">${CMDS.map(c=>`<button class="cmd" onclick="ask('${c}')">“${c}”</button>`).join('')}</div>`};
SC.body=()=>{const m=S.markers.find(x=>x.id==sel);
return `<div class="chips" style="margin-top:0">${HZ.map(h=>`<button class="f ${flt==h?'on':''}" onclick="flt='${h}';body.filter('${h}');go('body',1)">${h[0].toUpperCase()+h.slice(1)}</button>`).join('')}<span style="flex:1"></span>${LAY.map(l=>`<button class="f ${layer==l?'on':''}" onclick="body.setLayer('${l}');go('body',1)">${l[0].toUpperCase()+l.slice(1)}</button>`).join('')}</div>
<div class="card tr" style="padding:6px"><canvas class="b" id="cv"></canvas>${m?sideHTML(m):''}
<div style="position:absolute;left:16px;bottom:12px;color:var(--mut);font-size:13px">${['normal','watch','warning','critical'].map(l=>`<span style="color:${COL[l]}">${IC[l]} ${LB[l]}</span>`).join(' &nbsp; ')} · drag to rotate, tap a marker</div></div>
<div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between"><b>Mission day ${day} of ${S.total}</b><span id="cap" style="color:var(--cy)">“${LOG.filter(x=>x.n).slice(-1)[0]?.t||'Tap a marker or ask Nova about your body.'}”</span></div><input type="range" min="1" max="${S.total}" value="${day}" oninput="loadDay(+this.value)"></div>`};
function mod(k){const M=S.modules[k],R=S.rad;let x='';
if(k=='radiation'){const p=Math.min(1,M.metrics[0].value/R.limit);x=(R.spe?`<div class="card warn">⚠ <b>Space weather alert.</b> ${R.spe_text}</div>`:'')+`<div class="card row"><svg viewBox="0 0 200 115" width="240"><path d="M10 100A90 90 0 0 1 190 100" fill="none" stroke="#0B1426" stroke-width="16" stroke-linecap="round"/><path d="M10 100A90 90 0 0 1 190 100" fill="none" stroke="${p>.75?COL.warning:p>.5?COL.watch:COL.normal}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${p*283} 283"/><text x="100" y="86" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">${Math.round(p*100)}%</text><text x="100" y="108" text-anchor="middle" fill="#8DA2C4" font-size="11">${M.metrics[0].value} of ${R.limit} mSv limit</text></svg><div><h3>Mars transit vs surface</h3>Transit: <b>${M.metrics[1].value} mSv/day</b><br>Surface: <b>${M.metrics[2].value} mSv/day</b></div></div>`}
if(k=='gravity')x=`<div class="card"><h3>Exercise adherence (last 7 days)</h3><div class="dots">${S.adherence.map(a=>`<i style="background:${a?COL.normal:COL.warning};color:#0B1426">${a?'✓':'✕'}</i>`).join('')}</div><p>${S.adherence.filter(a=>a).length} of 7 sessions done</p></div>`;
if(k=='immune'){const v=M.metrics[3].value;x=`<div class="card"><h3>Infection risk meter</h3><div class="bar"><b style="width:${v*2}%;background:${COL[M.metrics[3].level]}"></b></div><p>${v} % ${stChip(M.metrics[3].level)}</p></div>`}
if(k=='mind')x=`<div class="card"><h3>Calming activities</h3><div class="row"><button class="cmd" onclick="ask('Breathing exercise')">🫁 Breathing</button><button class="cmd" onclick="ask('Play music')">♫ Music</button><button class="cmd" onclick="go('companion')">☎ Talk to someone</button></div></div>`;
const cut=`<svg viewBox="0 0 320 200" width="100%"><rect x="10" y="40" width="300" height="120" rx="60" fill="#0B1426" stroke="#22D3EE" stroke-width="2"/>${[['Crew',50,'normal'],['Lab',130,'watch'],['Sleep pods',210,'watch'],['Greenhouse',275,'normal']].map(([n,cx,l],i)=>`<rect x="${cx-35}" y="70" width="70" height="60" rx="10" fill="${COL[l]}22" stroke="${COL[l]}"/><text x="${cx}" y="105" text-anchor="middle" fill="#fff" font-size="11">${n}</text><text x="${cx}" y="122" text-anchor="middle" fill="${COL[l]}" font-size="11">${IC[l]}</text>`).join('')}</svg>`;
return `<div class="row" style="justify-content:space-between"><div class="row"><h2>${M.title}</h2>${modChip(M.chip)}</div><button class="btn" onclick="ask('${M.ask}')">🎙 ${M.askLabel}</button></div>
<div class="mgrid"><div class="col">${x}<div class="metrics">${M.metrics.map(met).join('')}</div>${k=='habitat'?`<div class="card"><h3>Anomaly alerts</h3>${M.anomalies.map(a=>`<p>▲ ${a}</p>`).join('')||'None'}</div>`:''}</div>
<div class="col"><div class="card" style="${k=='habitat'?'':'height:340px;padding:6px'}">${k=='habitat'?'<h3>Habitat cutaway</h3>'+cut:'<canvas class="b" id="cv"></canvas>'}</div><div class="card ins"><h3>AI insight</h3>${M.insight}</div></div></div>`}
['radiation','gravity','immune','mind','habitat'].forEach(k=>SC[k]=()=>mod(k));
SC.companion=()=>`<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div class="orb sm ${speaking?'sp':''}" id="orb"></div><div class="card chat" id="chat" style="flex:1">${LOG.map(b=>`<div class="bub ${b.n?'':'u'}">${b.t}</div>`).join('')||'<div class="bub">Hi Amara, I\'m here. How are you feeling?</div>'}</div></div>
<div class="chips">${['Explain my status','I feel lonely','Play music','Breathing exercise','Tell me a story','Messages from home','Play a game'].map(c=>`<button class="cmd" onclick="ask('${c}')">${c}</button>`).join('')}</div>
<div class="card ins"><b>Would you like to talk to a crew member or Earth?</b><div class="row" style="margin-top:8px"><button class="btn" onclick="toast('Calling Earth… 12 min signal delay (demo)')">Earth</button><button class="btn o" onclick="toast('Pinging crew mate (demo)')">Crew member</button></div></div>`;
SC.research=()=>{const m=S.markers.find(x=>x.id==rsel),E={Strong:'●●●',Moderate:'●●○',Emerging:'●○○'};
return `<h2>Countermeasure research</h2><div class="chips">${S.markers.map(x=>`<button class="f ${rsel==x.id?'on':''}" onclick="rsel='${x.id}';go('research',1)">${x.name}</button>`).join('')}</div>
<div class="card warn" style="margin-bottom:12px">Research information only, not a prescription.</div>
<div class="metrics">${m.hazards.flatMap(h=>S.counter[h].map(c=>({h,c}))).map(({h,c})=>`<div class="card"><h3>${h}</h3><b style="font-size:18px">${c[0]}</b><p><span class="ev">${E[c[1]]} ${c[1]} evidence</span></p><p style="color:var(--mut)">Safety: ${c[2]}</p></div>`).join('')}</div>`};

/* ---------- daily check-in ---------- */
const remCard=()=>{const C=S.checkin;return `<div class="card ${C.due.length?'warn':''}" style="margin-top:12px"><div class="row" style="justify-content:space-between"><div><b>Daily check-in: ${C.items.length-C.due.length} of ${C.items.length} logged</b><div style="color:var(--mut)">${C.due.length?'Still due: '+C.due.join(', '):'All done. Streak '+C.streak+' days.'}</div></div><button class="btn" onclick="go('checkin')">Open check-in</button></div></div>`};
SC.checkin=()=>{const C=S.checkin;
const card=i=>`<div class="card"><div class="row" style="justify-content:space-between"><h3>${i.label}</h3>${stChip(i.level)}</div><div class="val">${i.value} <small>${i.unit}</small></div>${chart(i.series,COL[i.level])}<p style="margin:4px 0"><small style="color:var(--mut)">${i.logged?'Logged today':'Not logged today'} · baseline ${i.baseline} (${i.dev>0?'+':''}${i.dev}%)</small></p><p style="margin:4px 0"><b>What to do:</b> ${i.action}</p><details><summary style="cursor:pointer;color:var(--cy)">Why and how to measure</summary><p><b>Why in space:</b> ${i.why}</p><p><b>How:</b> ${i.how}</p><p style="color:var(--mut)">Normal range ${i.n[0]}–${i.n[1]} ${i.unit}. ${i.src}</p></details>${i.escalate?'<button class="btn o" onclick="toast(\'Flight surgeon notified (demo)\')">Contact flight surgeon</button>':''}</div>`;
return `<div class="row" style="justify-content:space-between"><h2>Daily check-in</h2><div class="row"><span class="st" style="color:var(--cy)">Health score ${C.score}/100</span><span class="st" style="color:var(--yl)">🔥 ${C.streak}-day streak</span></div></div>
<div class="card warn" style="margin:12px 0">Guidance only, not a diagnosis. Demo data and placeholder ranges.</div>
${C.escalate?'<div class="card warn" style="margin-bottom:12px">▲ <b>One or more results need attention.</b> Contact your flight surgeon.</div>':''}
<div class="card"><h3>Enter today's measurements, or say: "my heart rate is 72"</h3><div class="metrics">${C.items.map(i=>`<label>${i.label} (${i.unit})<input id="in_${i.key}" type="number" step="any" placeholder="${i.value}" class="ti"></label>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn" onclick="submitCheckin()">Save check-in</button><button class="f" onclick="resetCheckin()">Reset demo</button></div><div id="cerr" style="color:var(--or);margin-top:6px"></div></div>
<div class="metrics" style="margin-top:12px">${C.items.map(card).join('')}</div>`};
async function submitCheckin(){const v={};document.querySelectorAll('.ti').forEach(e=>{if(e.value!=='')v[e.id.slice(3)]=e.value});
if(!Object.keys(v).length)return toast('Enter at least one value');
const j=await (await fetch('/api/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({values:v})})).json();
S=await (await fetch('/api/state?day='+day)).json();render();
if(j.errors&&j.errors.length){$('#cerr').textContent=j.errors.join(' ');return}toast('Check-in saved');
const w=S.checkin.items.find(i=>i.escalate);if(w)say('Your '+w.label.toLowerCase()+' is '+w.level+'. '+w.action)}
async function resetCheckin(){await fetch('/api/checkin/reset',{method:'POST'});S=await (await fetch('/api/state?day='+day)).json();render();toast('Demo reset')}

/* ---------- control ---------- */
function go(s,keep){screen=s;if(body){body.destroy();body=null}render()}
function render(){$('#dn').textContent='Mission day '+day+' / '+S.total;$('#rail').innerHTML=NAV.map(([k,i,l])=>`<button class="${screen==k?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}</button>`).join('');
$('#main').innerHTML=SC[screen]();const cv=$('#cv');if(cv){const hz=['radiation','gravity','immune','mind'].includes(screen)?screen:flt;
body=mkBody(cv,screen=='home'?{auto:1,cz:5.4}:screen=='body'?{filter:flt,layer,onPick:id=>{sel=id;go('body',1)}}:{filter:hz,cz:5.2,auto:1})}
const c=$('#chat');if(c)c.scrollTop=1e9}
async function loadDay(d){const old=S;day=d;S=await (await fetch('/api/state?day='+d)).json();$('#dn').textContent='Mission day '+day+' / '+S.total;
const w=S.markers.find((m,i)=>ORDER(m.level)>ORDER(old.markers[i].level));
if(body){body.update();body.filter(flt)}if(w){pulse=w.id;const t=`New: your ${w.name.toLowerCase()} is now ${w.level}. ${w.label}: ${w.value} ${w.unit}.`;const b=$('#bn');b.textContent='▲ '+t;b.classList.add('show');setTimeout(()=>{b.classList.remove('show');pulse=null},4500);say(t)}
const sd=document.querySelector('.side');if(sd&&sel)sd.outerHTML=sideHTML(S.markers.find(x=>x.id==sel));if(screen!='body'&&screen!='home')render()}
const ORDER=l=>['normal','watch','warning','critical'].indexOf(l);
function say(t){LOG.push({n:1,t});const tt=$('#tt');tt.textContent='Nova is speaking… '+t;const c=$('#cap');if(c)c.textContent='“'+t+'”';
speaking=true;$('#wave').classList.add('on');document.querySelectorAll('.orb').forEach(o=>o.classList.add('sp'));
const end=()=>{speaking=false;$('#wave').classList.remove('on');document.querySelectorAll('.orb').forEach(o=>o.classList.remove('sp'));tt.textContent='Nova is ready'};
if(!muted&&'speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.onend=end;u.onerror=end;speechSynthesis.speak(u)}else setTimeout(end,Math.min(6000,t.length*45));
const ch=$('#chat');if(ch){ch.insertAdjacentHTML('beforeend',`<div class="bub">${t}</div>`);ch.scrollTop=1e9}}
async function ask(text){text=text.replace(/^hey nova[, ]*/i,'');LOG.push({n:0,t:text});const ch=$('#chat');if(ch)ch.insertAdjacentHTML('beforeend',`<div class="bub u">${text}</div>`);
const r=await (await fetch('/api/nova',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,day})})).json();
S=await (await fetch('/api/state?day='+day)).json();if(r.select)sel=r.select;if(r.nav&&r.nav!=screen)go(r.nav);else if(r.select)go('body',1);else if(r.nav=='checkin')render();say(r.reply)}
$('#ti').onkeydown=e=>{if(e.key=='Enter'&&e.target.value.trim()){ask(e.target.value.trim());e.target.value=''}};
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇 Voice off':'🔊 Voice on';if(muted)speechSynthesis.cancel()};
$('#wave').innerHTML='<i></i>'.repeat(26);document.querySelectorAll('#wave i').forEach((e,i)=>e.style.animationDelay=(i*.05)+'s');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;
$('#mic').onclick=()=>{if(!SR)return toast('Speech recognition not supported here. Type to Nova instead.');if(rec){rec.stop();return}
rec=new SR();rec.lang='en-US';rec.interimResults=true;$('#mic').classList.add('on');$('#wave').classList.add('on');$('#tt').textContent='Listening…';
rec.onresult=e=>{const t=[...e.results].map(r=>r[0].transcript).join('');$('#tt').textContent='Listening… '+t;if(e.results[0].isFinal)ask(t)};
rec.onend=()=>{rec=null;$('#mic').classList.remove('on');if(!speaking)$('#wave').classList.remove('on')};rec.start()};
fetch('/api/state?day='+day).then(r=>r.json()).then(s=>{S=s;render()});
</script></body></html>
